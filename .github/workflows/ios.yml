# iOS: arhivă semnată + TestFlight, doar la cerere (minutele macOS costă de 10 ori mai mult).
# Semnarea: fastlane match (certificatele într-un repo Git privat, criptate) + cheia App Store Connect API.
# De ce așa și pașii pentru proprietară: docs/release.md
name: iOS

on:
  workflow_dispatch:
    inputs:
      incarca:
        description: "Încarcă în TestFlight"
        type: boolean
        default: true
      creeaza_certificate:
        description: "Prima rulare / capabilități noi: creează sau reînnoiește certificatul și profilul (match)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  testflight:
    name: Arhivă + TestFlight
    # Apple cere SDK-ul iOS 26 (Xcode 26) pentru încărcări; macos-latest îl are.
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verifică secretele
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          lipsa=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID MATCH_PASSWORD MATCH_GIT_URL MATCH_GIT_BASIC_AUTHORIZATION; do
            [ -n "${!s}" ] || lipsa="$lipsa $s"
          done
          if [ -n "$lipsa" ]; then echo "::error::Lipsesc secretele:$lipsa (vezi docs/release.md)"; exit 1; fi

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dependențe
        run: npm ci

      - name: Construiește aplicația web
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then export VITE_PUSH=1; fi
          npm run build

      - name: Proiectul iOS (dacă lipsește din repo)
        run: |
          if [ ! -d ios ]; then
            echo "::warning::app/ios nu e în repo; îl generez cu 'npx cap add ios' (Info.plist, capabilitățile și audio în fundal lipsesc!)."
            npx cap add ios
          fi

      - name: Firebase (GoogleService-Info.plist), dacă există secretul
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
            plutil -lint ios/App/App/GoogleService-Info.plist
          else
            echo "::warning::Fără GOOGLE_SERVICE_INFO_PLIST: versiunea NU va avea notificări push."
          fi

      - name: Capacitor sync
        run: npx cap sync ios

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: fastlane ios testflight
        working-directory: ${{ github.workspace }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_READONLY: ${{ inputs.creeaza_certificate && 'false' || 'true' }}
          AH_UPLOAD: ${{ inputs.incarca && '1' || '0' }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane ios testflight_beta

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: adelaharu-ios-${{ github.run_number }}
          path: |
            build/ios/*.ipa
            build/ios/*.dSYM.zip
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
          retention-days: 14
