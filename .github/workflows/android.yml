# Android: APK de test la fiecare push pe main; AAB semnat + Google Play (testare internă) doar la cerere.
# Pașii pentru proprietară: docs/release.md
name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      incarca:
        description: "Încarcă AAB-ul în Google Play (testare internă)"
        type: boolean
        default: true
      stare:
        description: "Starea versiunii în Play (draft până la prima versiune lansată manual)"
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "21"
  # versionCode = OFFSET + numărul rulării (crește mereu, nu se repetă)
  VERSION_CODE_OFFSET: "100"

jobs:
  debug:
    name: APK de test (debug)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Dependențe
        run: npm ci

      - name: Firebase (google-services.json), dacă există secretul
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_PUSH=1" >> "$GITHUB_ENV"
          else
            echo "::notice::Fără GOOGLE_SERVICES_JSON: aplicația se construiește fără notificări push."
          fi

      - name: Construiește aplicația web
        run: npm run build

      - name: Proiectul Android (dacă lipsește din repo)
        run: |
          if [ ! -d android ]; then
            echo "::warning::app/android nu e în repo; îl generez cu 'npx cap add android' (setările native personalizate lipsesc)."
            npx cap add android
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Gradle assembleDebug
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adelaharu-debug-${{ github.run_number }}
          path: app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: AAB semnat + Google Play
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: app
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verifică secretele
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          INCARCA: ${{ inputs.incarca }}
        run: |
          lipsa=""
          [ -n "$KS" ]  || lipsa="$lipsa ANDROID_KEYSTORE_BASE64"
          [ -n "$KSP" ] || lipsa="$lipsa ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KA" ]  || lipsa="$lipsa ANDROID_KEY_ALIAS"
          [ -n "$KP" ]  || lipsa="$lipsa ANDROID_KEY_PASSWORD"
          if [ "$INCARCA" = "true" ] && [ -z "$PLAY" ]; then lipsa="$lipsa PLAY_SERVICE_ACCOUNT_JSON"; fi
          if [ -n "$lipsa" ]; then echo "::error::Lipsesc secretele:$lipsa (vezi docs/release.md)"; exit 1; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Dependențe
        run: npm ci

      - name: Firebase (google-services.json), dacă există secretul
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "VITE_PUSH=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Fără GOOGLE_SERVICES_JSON: versiunea pentru magazin NU va avea notificări push."
          fi

      - name: Construiește aplicația web
        run: npm run build

      - name: Proiectul Android (dacă lipsește din repo)
        run: |
          if [ ! -d android ]; then
            echo "::warning::app/android nu e în repo; îl generez cu 'npx cap add android'."
            npx cap add android
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Versiunea (versionName din package.json, versionCode din numărul rulării)
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=$(( VERSION_CODE_OFFSET + GITHUB_RUN_NUMBER ))
          F=android/app/build.gradle
          if [ ! -f "$F" ]; then echo "::error::Nu găsesc $F (proiect Kotlin DSL? actualizează pasul)"; exit 1; fi
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode ${VERSION_CODE}/" "$F"
          sed -i -E "s/versionName[[:space:]]+\"[^\"]*\"/versionName \"${VERSION_NAME}\"/" "$F"
          grep -q "versionCode ${VERSION_CODE}" "$F" || { echo "::error::versionCode nu a putut fi setat în $F"; exit 1; }
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "### Android ${VERSION_NAME} (${VERSION_CODE})" >> "$GITHUB_STEP_SUMMARY"

      - name: Cheia de încărcare (upload keystore)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Gradle bundleRelease (semnat)
        working-directory: app/android
        env:
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KSP" \
            -Pandroid.injected.signing.key.alias="$KA" \
            -Pandroid.injected.signing.key.password="$KP"
          AAB=$(find "$PWD/app/build/outputs/bundle/release" -name "*.aab" | head -1)
          [ -n "$AAB" ] || { echo "::error::Nu s-a produs niciun AAB"; exit 1; }
          # verifică semnătura (jarsigner și keytool vin cu JDK).
          # Atenție: `jarsigner -verify` iese cu 0 și pe un AAB nesemnat („jar is unsigned.”),
          # deci verificăm textul, nu codul de ieșire.
          VERIFY_OUT=$(jarsigner -verify "$AAB" 2>&1) || true
          if ! printf '%s\n' "$VERIFY_OUT" | grep -q '^jar verified'; then
            printf '%s\n' "$VERIFY_OUT"
            echo "::error::AAB-ul nu e semnat"; exit 1
          fi
          # semnătura trebuie să fie chiar cu cheia de încărcare din secrete
          FP_KEY=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KSP" -alias "$KA" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1)
          FP_AAB=$(keytool -printcert -jarfile "$AAB" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1)
          if [ -z "$FP_KEY" ] || [ "$FP_KEY" != "$FP_AAB" ]; then
            echo "::error::AAB-ul nu e semnat cu cheia de încărcare (cheie: ${FP_KEY:-?}, AAB: ${FP_AAB:-?})"; exit 1
          fi
          echo "AAB_PATH=$AAB" >> "$GITHUB_ENV"

      - name: Șterge cheia de pe runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adelaharu-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}-aab
          path: ${{ env.AAB_PATH }}
          if-no-files-found: error
          retention-days: 30

      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        if: inputs.incarca
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Încarcă în Google Play (testare internă)
        if: inputs.incarca
        working-directory: ${{ github.workspace }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ inputs.stare }}
        run: bundle exec fastlane android interna
