# iOS: doar compilare pentru simulator, fără semnătură și fără conturi Apple (prinde erorile din Swift: aplicația + widgetul).
# Nu produce nimic de instalat pe telefon. La cerere (minutele macOS costă de 10 ori mai mult).
name: iOS compilare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-compilare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compileaza:
    name: Compilare simulator (fără semnătură)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dependențe
        run: npm ci

      - name: Pagina offline
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync ios

      - name: xcodebuild (simulator, fără semnătură)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*(Ah|Widget)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
